syntax = "proto3";
package anyNodeSync;

option go_package = "nodesync/nodesyncproto";

enum ErrCodes {
    Unexpected = 0;
    ExpectedCoordinator = 1;
    UnsupportedStorage = 2;
    SpaceDeleted = 3;
    ArchiveUnavailable = 4;
    ArchiveObjectMissing = 5;
    PeerIsNotNode = 6;
    ErrorOffset = 1000;
}

service NodeSync {
    // PartitionSync compares all spaces by given c-hash partition
    rpc PartitionSync(PartitionSyncRequest) returns (PartitionSyncResponse);
    // ColdSync requests cold sync stream for fast space download
    rpc ColdSync(ColdSyncRequest) returns (stream ColdSyncResponse);
    // AdoptArchive offers the receiver an archived space snapshot parked in the
    // shared archive store; the receiver copies the object into its own prefix
    // and registers the space as archived without materializing it
    rpc AdoptArchive(AdoptArchiveRequest) returns (AdoptArchiveResponse);
}

// PartitionSyncRange presenting a request for one range
message PartitionSyncRange {
    uint64 from = 1;
    uint64 to = 2;
    uint32 limit = 3;
    bool elements = 4;
}

// PartitionSyncResult presenting a response for one range
message PartitionSyncResult {
    bytes hash = 1;
    repeated PartitionSyncResultElement elements = 2;
    uint32 count = 3;
}

// PartitionSyncResultElement presenting state of one object
message PartitionSyncResultElement {
    string id = 1;
    string head = 2;
}

// HeadSyncRequest is a request for HeadSync
message PartitionSyncRequest {
    uint64 partitionId = 1;
    repeated PartitionSyncRange ranges = 2;
}

// PartitionSyncResponse is a response for HeadSync
message PartitionSyncResponse {
    repeated PartitionSyncResult results = 1;
}

message ColdSyncRequest {
    string spaceId = 1;
    ColdSyncProtocolType protocolType = 2;
}

message ColdSyncResponse {
    string filename = 2;
    bytes data = 3;
    uint32 crc32 = 4;
    ColdSyncProtocolType protocolType = 5;
}

enum ColdSyncProtocolType {
    Pogreb = 0;
    AnystoreSqlite = 1;
}

message AdoptArchiveRequest {
    string spaceId = 1;
    // srcKey is the full key of the gzipped snapshot within the shared bucket (sender's prefix)
    string srcKey = 2;
    // heads hashes of the space at snapshot time, as stored in the sender's index
    string oldHash = 3;
    string newHash = 4;
    // eager asks the receiver to restore the space in background right away
    bool eager = 5;
    int64 compressedSize = 6;
    int64 uncompressedSize = 7;
}

message AdoptArchiveResponse {
    AdoptArchiveResult result = 1;
}

enum AdoptArchiveResult {
    // the snapshot was copied and registered
    AdoptArchiveOk = 0;
    // the receiver already holds a live or archived copy of the space
    AdoptArchiveAlreadyHave = 1;
}